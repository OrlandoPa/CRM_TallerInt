<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Panel Inteligente para Gestión de Citas Odontológicas" />
  <title>Panel de Gestión de Citas</title>
  <!-- Fuentes web (software verde, RNF-VERDE-08): sin eje óptico en Source Serif 4
       (51 KB en vez de 122 KB) y se omiten si el navegador pide ahorro de datos (Save-Data);
       en ese caso se usan las fuentes del sistema definidas en index.css. -->
  <script>
    (function () {
      var c = navigator.connection;
      if (c && c.saveData) {
        document.documentElement.classList.add('ahorro-datos');
        return;
      }
      var l = document.createElement('link');
      l.rel = 'stylesheet';
      l.href = 'https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:wght@500;600&display=swap';
      document.head.appendChild(l);
    })();
  </script>
  <!-- UserWay Accessibility Widget (Position 3: Bottom-Right) -->
  <script>
    window.UserWayConfig = {
      position: 3
    };
  </script>
  <script src="https://cdn.userway.org/widget.js" data-position="3" async></script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
